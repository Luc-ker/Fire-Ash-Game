<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    #map {
      position: relative;
      width: 480px;
      height: 320px;
    }

    #map > img[name="map"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 480px;
      height: 320px;
      z-index: 1;
    }

    #mapPoints {
      position: absolute;
      left: 0;
      top: 0;
      width: 480px;
      height: 320px;
      z-index: 2;
    }

    #mapPoints > div {
      position: absolute;
    }

    #mapPoints img {
      display: block;
      width: auto;
      height: auto;
    }

    .map-container {
      overflow-x: auto;
    }

    .editor-column {
      padding: 1rem;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <div class="col-md-6 editor-column">
      <div class="map-container mb-3">
        <div id="map">
          <img name="map"
              src="Graphics/Pictures/mapRegion0.png"
              alt=""
              width="480"
              height="320"/>

          <div id="mapPoints"></div>
        </div>
      </div>
      <form name="mf" action="javascript:void(null)">
        <div class="mb-3">

          <div class="mb-2">
            <label for="filename" class="form-label">
              Map Filename (in Graphics/Pictures):
            </label>
            <div class="input-group">
              <input
                type="text"
                id="filename"
                name="filename"
                value="mapRegion0.png"
                class="form-control"
              />
              <input
                type="button"
                name="btnChange"
                value="Change"
                class="btn btn-primary"
              />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Square size:</label>
            <div class="row g-2">
              <div class="col-auto">
                <div class="input-group">
                  <span class="input-group-text">W</span>
                  <input
                    type="text"
                    name="sqwidth"
                    size="4"
                    min="1"
                    max="16"
                    value="16"
                    class="form-control"
                  />
                </div>
              </div>

              <div class="col-auto">
                <div class="input-group">
                  <span class="input-group-text">H</span>
                  <input
                    type="text"
                    name="sqheight"
                    size="4"
                    min="1"
                    max="16"
                    value="16"
                    class="form-control"
                  />
                </div>
              </div>

              <div class="col-auto">
                <input
                  type="button"
                  name="btnRefresh"
                  value="Refresh"
                  class="btn btn-secondary"
                />
              </div>
            </div>
          </div>

          <div class="mb-2">
            <label for="regionName" class="form-label">
              Region Name:
            </label>
            <div class="input-group">
              <input
                type="text"
                id="regionName"
                name="name"
                value="Sample Region"
                class="form-control"
              />
              <input
                type="button"
                name="btnChange2"
                value="Change"
                class="btn btn-primary"
              />
            </div>
          </div>

        </div>
      </form>
      <hr>
    </div>


    <div class="col-md-6 editor-column">

      <form name="f" action="javascript:void(null)">

        <div class="table-responsive mb-3">
          <table class="table table-sm align-middle">
            <tbody>
              <tr>
                <td>Current Position:</td>
                <td>
                  <input
                    type="text"
                    name="curpos"
                    readonly
                    class="form-control"
                  />
                </td>
              </tr>

              <tr>
                <td>Name:</td>
                <td>
                  <input
                    type="text"
                    name="locname"
                    class="form-control"
                  />
                </td>
              </tr>

              <tr>
                <td>Point of Interest:</td>
                <td>
                  <input
                    type="text"
                    name="poi"
                    class="form-control"
                  />
                </td>
              </tr>

              <tr>
                <td>Fly Destination:</td>
                <td>
                  <input
                    type="text"
                    name="healing"
                    class="form-control"
                  />
                </td>
              </tr>

              <tr>
                <td>Switch:</td>
                <td>
                  <input
                    type="text"
                    name="swtch"
                    class="form-control"
                  />
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mb-3">
          <input
            type="button"
            name="btnSave"
            value="Save"
            disabled="disabled"
            class="btn btn-primary"
          />

          <input
            type="button"
            name="btnCancel"
            value="Cancel"
            class="btn btn-secondary"
          />
        </div>

        <div class="mb-2">
          <label for="data" class="form-label">
            Single section from townmap.txt (without section heading):
          </label>

          <textarea
            name="data"
            id="data"
            rows="10"
            class="form-control font-monospace"
          ></textarea>
        </div>

        <div class="mb-2">
          <input
            type="button"
            name="btnLoad"
            value="Load"
            class="btn btn-primary"
          />
          <span class="text-muted">
            To load data into the editor
          </span>
        </div>

        <p class="text-muted">
          Copy the data above into townmap.txt when you're done.
        </p>

      </form>

    </div>

  </div>
</div>

<script type="text/javascript">
  choiceX=-1
  choiceY=-1
  mappoints=[]
  mpelements=[]

  function target(event){
    return event.target||event.srcElement
  }

  function addChild(e){
    document.getElementById("mapPoints").appendChild(e);
  }

  function removeChild(e){
    if(e.parentNode){
      e.parentNode.removeChild(e);
    }
  }

  function positionedOffset(element) {
    var valueT = 0, valueL = 0;
    do {
      valueT += element.offsetTop  || 0;
      valueL += element.offsetLeft || 0;
      element = element.offsetParent;
      if (element) {
        p = element.style.position;
        if (p == 'relative' || p == 'absolute') break;
      }
    } while (element);
    return [valueL, valueT];
  }

  function pointerX(event) {
    return event.pageX || (event.clientX +
      (document.documentElement.scrollLeft || document.body.scrollLeft));
  }

  function pointerY(event) {
    return event.pageY || (event.clientY +
      (document.documentElement.scrollTop || document.body.scrollTop));
  }

  function elementPos(event){
    t=target(event)
    po=positionedOffset(t)
    return [(pointerX(event))-po[0],(pointerY(event))-po[1]]
  }

  function elementPosObject(event,other){
    t=other
    po=positionedOffset(t)
    return [(pointerX(event))-po[0],(pointerY(event))-po[1]]
  }

  function attachEvent(element,name,observer,useCapture){
    if (element.addEventListener) {
      element.addEventListener(name, observer, useCapture||false);
    } else if (element.attachEvent) {
      element.attachEvent('on' + name, observer);
    }
  }

  function qstr(text){
    var temp; 
    temp = text.toString();
    while (true){
      if (temp == '') return text;
      if (temp.indexOf("'") >= 0) break;
      if (temp.indexOf('"') >= 0) break;
      if (temp.indexOf(' ') >= 0) break;
      if (temp.indexOf(',') >= 0) break;
      return temp;
    }
    return temp
  }

  function CsvNextToken(dataobj){
    var i;
    var text;
    var c,n;
    var inside;
    var value; 
    var q = '';
    inside = false;
    value = '';
    var skip = false;
    var data=dataobj[0]
    if (data == '') return '';
    text = '';
    for (i = 0; i < data.length; ++i){
      if (skip){
        skip = false;
        continue;
      }
      c = data.charAt(i);
      n = '';
      if (inside){
        if (c == q) {
          if (i < data.length-1) n = data.charAt(i+1);
          if (n == q){
            value = value + c;
            skip = true;
            continue;
          }
          inside = false;
          continue;
        }
        value = value + c;
        continue;  
      }
      if (c == ',') break;
      value = value + c;
    }
    if (i >= (data.length-1)) { dataobj[0]= ''; }
    else{dataobj[0]=data.substr(i+1);}
    dataobj[0]=dataobj[0].replace(/^\s+/,"").replace(/\s+$/,"")
    return value;
  }

///////////////////////////
  function loadMapPoints(){
    mappoints=[]
    lines=document.f.data.value.split("\n")
    for(var i=0;i<lines.length;i++){
      lines[i]=lines[i].replace(/\s+$/,"")
      if(!/^\#/.test(lines[i])&&!/^\s*$/.test(lines[i])){
        e=/^\s*(\w+)\s*=\s*(.*)$/.exec(lines[i])
        if(!e){
          alert("Bad line syntax in line "+(i+1))
        }
        if(e[1]=="Filename"){
          o=document.images.map;
          o.src=`Graphics/Pictures/${e[2]}`;
        } else if(e[1]=="Name"){
          document.mf.name.value=e[2]
        } else if(e[1]=="Point"){
          data=[e[2]]
          mappt=[]
          mappt[0]=parseInt(CsvNextToken(data),10)
          mappt[1]=parseInt(CsvNextToken(data),10)
          mappt[2]=CsvNextToken(data)
          mappt[3]=CsvNextToken(data)
          mappt[4]=[CsvNextToken(data),CsvNextToken(data),CsvNextToken(data)]
          mappt[5]=CsvNextToken(data)
          mappoints[mappoints.length]=mappt
        }
      }
    }
  }

  function createMapPoint(imgfile,x,y){
    var e=document.createElement("div");

    e.innerHTML="<img src='"+imgfile+"' alt=''/>";

    e.style.position="absolute";
    e.style.left=(
      x*parseInt(document.mf.sqwidth.value,10) +
      (parseInt(document.mf.sqwidth.value,10)-8)/2
    )+"px";

    e.style.top=(
      y*parseInt(document.mf.sqheight.value,10) +
      (parseInt(document.mf.sqheight.value,10)-8)/2
    )+"px";

    e.style.zIndex="3";

    attachEvent(e,"mousemove",MapMouseMove);
    attachEvent(e,"click",MapClick);

    return e;
  }

  function showMapPoints(){
    for(var i=0;i<mpelements.length;i++){
      removeChild(mpelements[i]);
    }

    mpelements=[];

    for(var i=0;i<mappoints.length;i++){
      var e=createMapPoint(
        "knownpoint.bmp",
        mappoints[i][0],
        mappoints[i][1]
      );

      addChild(e);
      mpelements[mpelements.length]=e;
    }

    if(choiceX!=-1 || choiceY!=-1){
      var e=createMapPoint(
        "selpoint.bmp",
        choiceX,
        choiceY
      );

      addChild(e);
      mpelements[mpelements.length]=e;
    }
  }

  function MapMouseMove(e){
    if(choiceX==-1 && choiceY==-1){
      elempos=elementPosObject(e,document.getElementById("map"))
      if (elempos[0]>=0 && elempos[0]<480 && elempos[1]>=0 && elempos[1]<320){
        setMapPoint(Math.floor(elempos[0]/document.mf.sqwidth.value),
                    Math.floor(elempos[1]/document.mf.sqheight.value))
      }
    }
  }

  function MapClick(e){
    elempos=elementPosObject(e,document.getElementById("map"))
    if(elempos[0]>=0 && elempos[0]<480 && elempos[1]>=0 && elempos[1]<320){
      choiceX=Math.floor(elempos[0]/document.mf.sqwidth.value)
      choiceY=Math.floor(elempos[1]/document.mf.sqheight.value)
      setMapPoint(Math.floor(elempos[0]/document.mf.sqwidth.value),
                  Math.floor(elempos[1]/document.mf.sqheight.value))
      document.f.btnSave.disabled=false
      showMapPoints()
    }
  }

  function getbase(fn){
    if(fn.lastIndexOf("/")>=0){
      fn=fn.substr(fn.lastIndexOf("/")+1)
    }
    if(fn.lastIndexOf("\\")>=0){
      fn=fn.substr(fn.lastIndexOf("\\")+1)
    }
    return fn
  }

  function genMapPoints(){
    ret=""
    ret+="Filename = "+qstr(getbase(document.images.map.src))+"\r\n"
    ret+="Name = "+qstr(document.mf.name.value)+"\r\n"
    for(var i=0;i<mappoints.length;i++){
      ret+="Point = "+[mappoints[i][0],mappoints[i][1],
           qstr(mappoints[i][2]),qstr(mappoints[i][3]),
           mappoints[i][4][0]!=null?mappoints[i][4][0]:"",
           mappoints[i][4][1]!=null?mappoints[i][4][1]:"",
           mappoints[i][4][2]!=null?mappoints[i][4][2]:"",
           mappoints[i][5]]+"\r\n"
    }
    document.f.data.value=ret
    showMapPoints()
  }

  function setMapPoint(x,y){
    document.f.curpos.value=[x,y]
    for(var i=0;i<mappoints.length;i++){
      if(mappoints[i][0]==x && mappoints[i][1]==y){
        document.f.locname.value=mappoints[i][2]
        document.f.poi.value=mappoints[i][3]
        document.f.healing.value=mappoints[i][4]
        document.f.swtch.value=mappoints[i][5]
        return
      }
    }
    document.f.locname.value=""
    document.f.poi.value=""
    document.f.healing.value=""
    document.f.swtch.value=""
  }

  function addMapPoint(x,y){
    for(var i=0;i<mappoints.length;i++){
      if(mappoints[i][0]==x && mappoints[i][1]==y){
        mappoints[i][2]=document.f.locname.value
        mappoints[i][3]=document.f.poi.value
        mappoints[i][4]=document.f.healing.value.split(",")
        mappoints[i][5]=document.f.swtch.value
        return
      }
    }
    mappoints[mappoints.length]=[x,y,
                                 document.f.locname.value,
                                 document.f.poi.value,
                                 document.f.healing.value.split(","),
                                 document.f.swtch.value,
    ]
  }

  attachEvent(window,"load",function(e){
    genMapPoints()
    attachEvent(document.images.map,"mouseout",function(e){
      if(choiceX==-1 && choiceY==-1){
        document.f.curpos.value=""
      }
    })
    attachEvent(document.getElementById("map"),"mousemove",MapMouseMove)
    attachEvent(document.getElementById("map"),"click",MapClick)
    attachEvent(document.f.btnSave,"click",function(e){
      if(choiceX!=-1 || choiceY!=-1){
        addMapPoint(choiceX,choiceY)
        genMapPoints()
        target(e).disabled=true
        choiceX=choiceY=-1
        showMapPoints()
      }
    })
    attachEvent(document.f.btnCancel,"click",function(e){
      if(choiceX!=-1||choiceY!=-1){
        setMapPoint(choiceX,choiceY)
        choiceX=choiceY=-1
        showMapPoints()
      }
    })
    attachEvent(document.f.btnLoad,"click",function(e){
      loadMapPoints()
      genMapPoints()
      choiceX=choiceY=-1
      showMapPoints()
    })
    attachEvent(document.mf.btnChange,"click",function(e){
      document.images.map.src="Graphics/Pictures/"+document.mf.filename.value
      genMapPoints()
      showMapPoints()
    })
    attachEvent(document.mf.btnChange2,"click",function(e){
      genMapPoints()
      showMapPoints()
    })
    attachEvent(document.mf.btnRefresh,"click",function(e){
      choiceX=choiceY=-1
      document.f.curpos.value=""
      showMapPoints()
    })
  })
</script>
</body>
